<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0e13">
<title>Study — Batch Library</title>
<style>
:root{color-scheme:dark;--bg:#0b0e13;--panel:#111722;--line:#293241;--text:#f5f7fb;--muted:#9aa5b5;--green:#20c56b;--yellow:#ffd21f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{color:inherit;cursor:pointer}.sidebar{position:fixed;inset:0 auto 0 0;width:235px;padding:24px 14px;background:#10141c;border-right:1px solid var(--line);z-index:3}.brand{display:flex;align-items:center;gap:12px;padding:8px;font-weight:850;font-size:17px}.brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(140deg,#24cf74,#087c47)}nav{display:grid;gap:6px;margin-top:26px}nav a{padding:12px 14px;border-radius:9px;color:#b7c0ce;text-decoration:none}nav a:hover,nav a.active{background:#1b2532;color:#fff}nav a.active{box-shadow:inset 3px 0 var(--green)}.main{margin-left:235px}.topbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;height:72px;padding:0 28px;border-bottom:1px solid var(--line);background:#0b0e13ee;backdrop-filter:blur(12px)}.topbar strong{font-size:16px}.topbar span{padding:7px 12px;border:1px solid #55451a;border-radius:99px;background:#211d12;color:#ffe166;font-size:13px;font-weight:750}main{padding:28px}.content{max-width:1400px;margin:auto;padding:26px;border:1px solid #303844;border-radius:12px}h1{margin:0;font-size:28px}.intro{margin:5px 0 20px;color:var(--muted)}.search{display:flex;gap:8px;margin-bottom:22px;padding:8px;border:1px solid #3a424e;border-radius:9px;background:#242a33}.search input{width:100%;min-width:0;padding:7px;border:0;outline:0;background:transparent;color:var(--text);font-size:16px}.search input::placeholder{color:#9ba5b3}.search button,.primary{border:0;border-radius:8px;background:var(--green);color:#052516;font-weight:750;padding:10px 18px}.hero{position:relative;display:flex;align-items:center;min-height:170px;overflow:hidden;margin-bottom:18px;padding:28px 6%;border:1px solid #343946;border-radius:10px;background:radial-gradient(ellipse at 82% 18%,#c4224466,transparent 40%),linear-gradient(110deg,#111217 10%,#28121b 56%,#471528)}.hero small{color:#ffd923;font-weight:850;letter-spacing:.16em}.hero h2{margin:5px 0 12px;font-size:clamp(25px,4vw,40px);line-height:1.15}.hero a{display:inline-block;padding:7px 12px;border-radius:6px;background:#ffd923;color:#15130a;text-decoration:none;font-size:12px;font-weight:900}.status{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0 16px;color:var(--muted);font-size:13px}.status button{border:0;background:transparent;color:#66e49c;font-weight:750}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{min-width:0;overflow:hidden;border:1px solid #303b4b;border-radius:12px;background:var(--panel)}.card-body{padding:15px}.title-row{display:flex;justify-content:space-between;gap:8px;min-height:54px}.title-row h2{display:-webkit-box;overflow:hidden;margin:0 0 12px;font-size:18px;line-height:1.4;-webkit-box-orient:vertical;-webkit-line-clamp:2}.badge{flex:0 0 auto;height:fit-content;padding:3px 8px;border-radius:5px;background:var(--yellow);color:#201b00;font-size:11px;font-weight:800}.cover{display:block;width:100%;height:150px;object-fit:cover;border-radius:8px;background:#182233}.meta{display:grid;gap:7px;margin:14px 0;color:#c1cad6;font-size:13px}.price{color:#7de6a8;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{min-height:39px;border-radius:7px;font-weight:700}.study{border:1px solid #3b4655;background:#1a222e}.enroll{border:1px solid #23c66d;background:var(--green);color:#062516}.empty{grid-column:1/-1;padding:40px 12px;color:var(--muted);text-align:center}.detail[hidden],.listing[hidden]{display:none}.detail-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}.back{border:1px solid var(--line);border-radius:8px;background:#171d28;padding:9px 13px}.summary{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,.8fr);gap:22px;align-items:start}.summary img{width:100%;max-height:350px;object-fit:cover;border:1px solid var(--line);border-radius:10px}.facts{display:grid;gap:12px}.fact{padding-bottom:10px;border-bottom:1px solid var(--line);color:var(--muted)}.fact strong{display:block;color:var(--text)}.official{display:inline-block;width:fit-content;padding:10px 14px;border-radius:8px;background:var(--green);color:#052516;text-decoration:none;font-weight:800}.notice{padding:13px;border:1px solid #62522b;border-radius:9px;background:#272113;color:#f0dda0}.toast{position:fixed;right:20px;bottom:20px;padding:12px 16px;border:1px solid #405045;border-radius:9px;background:#17241c;color:#e7f8eb;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1} @media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.sidebar{position:static;width:auto;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:4px}nav{display:flex;overflow:auto;margin-top:8px}nav a{white-space:nowrap;padding:8px 11px}.main{margin:0}.topbar{height:60px;padding:0 16px}main{padding:12px}.content{padding:16px 12px}.grid{grid-template-columns:1fr}.cover{height:180px}.summary{grid-template-columns:1fr}.hero{min-height:145px;padding:20px}}
</style>
</head>
<body>
<aside class="sidebar"><div class="brand"><span class="brand-mark">S</span>STUDY SPACE</div><nav><a href="#study">Study</a><a class="active" href="#batches">Batches</a><a href="https://pwthor.live/study/mybatches">My Batches</a><a href="https://t.me/pw_thor">Join Telegram</a><a href="https://pwthor.live/study/donate-batch">Donate Batch</a><a href="https://test.pwthor.live">Test Series</a></nav></aside>
<div class="main"><header class="topbar"><strong>Study · Batch Library</strong><span>🏅 &nbsp;0 XP</span></header><main id="batches"><section class="content listing" id="listing"><h1>Explore batches</h1><p class="intro">Search all PW Thor batches, or browse the full list with Load More.</p><form class="search" id="searchForm"><input id="searchInput" type="search" placeholder="Search your batch" aria-label="Search batches"><button>Search</button></form><section class="hero"><div><small>LEARN SOMETHING NEW</small><h2>Big goals. Small steps.<br>Brighter future.</h2><a href="#batchGrid">EXPLORE COURSES</a></div></section><div class="status" id="status" role="status" aria-live="polite"></div><section class="grid" id="batchGrid" aria-label="Available batches"></section></section><section class="content detail" id="detail" hidden><div class="detail-head"><button class="back" id="back">← All batches</button><h1 id="detailTitle"></h1></div><div class="summary" id="summary"></div></section></main></div><div class="toast" id="toast" role="status"></div>
<script>
const API='https://pwthor.live/api';const batches=[];let page=0,totalPages=0,totalItems=0,searchMode=false,loading=false,requestId=0,timer;const grid=document.querySelector('#batchGrid'),status=document.querySelector('#status'),input=document.querySelector('#searchInput'),listing=document.querySelector('#listing'),detail=document.querySelector('#detail'),toast=document.querySelector('#toast');let more;
function notify(text){toast.textContent=text;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),2500)}function date(value){if(!value)return'Not specified';const d=new Date(value+'T00:00:00');return isNaN(d)?value:new Intl.DateTimeFormat('en',{day:'numeric',month:'short',year:'numeric'}).format(d)}function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text)e.textContent=text;return e}
function card(b){const article=node('article','card'),body=node('div','card-body'),row=node('div','title-row'),title=node('h2','',b.batchName||'Batch'),badge=node('span','badge',b.language||'Batch'),img=node('img','cover'),meta=node('div','meta'),price=node('div','price',Number(b.batchPrice)===0?'₹ FREE':`₹ ${b.batchPrice}`),actions=node('div','actions');img.src=b.batchImage||'';img.alt=b.batchName||'Batch cover';img.loading='lazy';img.onerror=()=>img.remove();row.append(title,badge);if(b.byName)meta.append(node('div','',b.byName));meta.append(node('div','',`${date(b.startDate)} · ${date(b.endDate)}`),price);for(const [label,cls] of [['Study','study'],['Enroll Now','enroll']]){const btn=node('button',cls,label);btn.onclick=()=>openBatch(b);actions.append(btn)}body.append(row,img,meta,actions);article.append(body);return article}
function render(){grid.replaceChildren(...batches.map(card));if(!batches.length&&!loading)grid.append(node('div','empty',input.value?'No matching batches found.':'No batches available.'));status.replaceChildren(document.createTextNode(`${batches.length.toLocaleString()} of ${totalItems.toLocaleString()} ${searchMode?'matching batches':'batches loaded'}`),more);more.hidden=page>=totalPages;more.disabled=loading;more.textContent=loading?'Loading…':searchMode?'Load more results':'Load more batches'}
async function load(reset=false){if(loading&&!reset)return;if(reset){requestId++;loading=false;batches.length=0;page=0;totalPages=0;totalItems=0}if(totalPages&&page>=totalPages)return;const id=++requestId,q=input.value.trim();searchMode=Boolean(q);loading=true;render();try{const url=searchMode?`${API}/searchBatch?name=${encodeURIComponent(q)}&page=${page+1}`:`${API}/AllBatches?page=${page+1}`;const r=await fetch(url);if(!r.ok)throw Error(`HTTP ${r.status}`);const data=await r.json();if(id!==requestId)return;if(!data.success||!Array.isArray(data.data))throw Error('Unexpected PW Thor response');const known=new Set(batches.map(b=>b.batchId||b._id));for(const b of data.data){const key=b.batchId||b._id;if(key&&!known.has(key)){batches.push(b);known.add(key)}}page=data.currentPage;totalPages=data.totalPages;totalItems=data.totalItems}catch(e){if(id===requestId){console.error(e);notify('Could not load PW Thor batches. Check your connection.')}}finally{if(id===requestId){loading=false;render()}}}
function openBatch(b){listing.hidden=true;detail.hidden=false;document.querySelector('#detailTitle').textContent=b.batchName||'Batch details';const summary=document.querySelector('#summary');summary.replaceChildren();if(b.batchImage){const img=node('img');img.src=b.batchImage;img.alt=b.batchName||'Batch cover';summary.append(img)}const facts=node('div','facts');for(const [label,value] of [['Batch',b.batchName||'Batch'],['About',b.byName||'No description provided'],['Language',b.language||'Not specified'],['Course dates',`${date(b.startDate)} · ${date(b.endDate)}`],['Price',Number(b.batchPrice)===0?'Free':`₹ ${b.batchPrice}`]]){const f=node('div','fact'),strong=node('strong','',label);f.append(strong,document.createTextNode(value));facts.append(f)}facts.append(node('p','notice','Full classes are hosted by PW Thor. Use this link to view the official batch page.'));const link=node('a','official','View classes on PW Thor');link.href=`https://pwthor.live/study/batches/${encodeURIComponent(b.batchId||b._id)}`;link.target='_blank';link.rel='noopener noreferrer';facts.append(link);summary.append(facts)}
document.querySelector('#back').onclick=()=>{detail.hidden=true;listing.hidden=false};document.querySelector('#searchForm').onsubmit=e=>{e.preventDefault();clearTimeout(timer);load(true)};input.oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>load(true),350)};more=node('button','','Load more batches');more.onclick=()=>load();render();load();
</script>
</body>
</html>
